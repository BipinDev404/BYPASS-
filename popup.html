<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>BYPass</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<h2>BYPASS</h2>

<div id="theme-toggle" class="theme-btn" title="Toggle Theme">
  <!-- Sun Icon (hidden by default) -->
  <svg id="icon-sun" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
  <!-- Moon Icon -->
  <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</div>

<div id="unlock-section" class="login-wrapper">
  <div class="avatar-circle">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
  </div>
  <h3 class="login-name">BIPIN YADAV</h3>
  <input id="master" type="password" placeholder="Master Password">
  <button id="unlock" class="primary">Unlock</button>
  <p id="error-msg" class="error">Invalid master password.</p>
  
  <div style="text-align: center; margin-top: 15px;">
    <a href="#" id="how-to-use-link" style="color: #ff4b13; text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
      How to use 
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
    </a>
  </div>
</div>

<div id="how-to-use-section" style="display: none;">
  <h3 style="color: #ff4b13; margin-top: 0;">How to Use</h3>
  <ul style="font-size: 13px; line-height: 1.5; color: #ccc; margin-left: 15px; padding-left: 0; list-style-type: decimal;">
    <li style="margin-bottom: 8px; border: none; padding: 0; background: transparent;">Unlock your vault using the master password.</li>
    <li style="margin-bottom: 8px; border: none; padding: 0; background: transparent;">Add accounts manually with the "New Password + " button.</li>
    <li style="margin-bottom: 8px; border: none; padding: 0; background: transparent;">On website login pages, look for the small key icon next to password fields. Click it to auto-fill!</li>
  </ul>
  <button id="back-to-login" style="margin-top: 15px;">Back to Login</button>
</div>

<div id="vault-section">
  <button id="toggle-add" class="primary" style="margin-bottom: 12px;">New Password +</button>
  
  <div id="add-form" style="display: none; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1);">
    <input id="name" placeholder="Account Name (e.g. Google)">
    <input id="user" placeholder="Username / Email">
    <div class="row">
      <input id="pass" placeholder="Password">
      <button id="gen">Gen</button>
    </div>
    <button id="save" class="primary">Save to Vault</button>
  </div>

  <hr style="margin-top: 0; border: none; border-bottom: 1px solid #333; margin-bottom: 12px;">
  <div class="row">
    <input id="search" placeholder="Search Vault..." style="margin-bottom: 0;">
    <button id="export-btn" style="width: auto; padding: 0 12px; margin-bottom: 0;" title="Export Vault (JSON)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    </button>
  </div>
  <ul id="list" style="margin-top: 12px;"></ul>
</div>

<script src="popup.js"></script>
</body></html>
